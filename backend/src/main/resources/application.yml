spring:
  application:
    name: hiretrack
  
  # Active profile set via environment variable: SPRING_PROFILES_ACTIVE=dev
  
  jpa:
    hibernate:
      ddl-auto: validate              # Flyway owns schema
    show-sql: false                   # Production default (dev overrides)
    open-in-view: false               # Prevents view-layer lazy loading
  
  flyway:
    enabled: true
  
  # Spring Session JDBC: server-side session storage
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never        # Flyway owns schema (V5 migration)
      table-name: spring_session

# Server configuration
server:
  servlet:
    session:
      timeout: 30m                    # Session timeout (30 minutes of inactivity)
      cookie:
        http-only: true               # Prevent JavaScript access to session cookie
        secure: false                 # Dev default (no HTTPS); prod overrides to true
        same-site: lax                # CSRF protection (lax allows GET from external sites)
        name: SESSION                 # Cookie name (default is JSESSIONID)

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized   # Hide DB details from unauthenticated users
